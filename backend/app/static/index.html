<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Ledger · Supervisor board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121826'/%3E%3Cpath d='M10 12h12M10 17h12M10 22h7' stroke='%233FA3EA' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap">
<div class="window">
<nav class="side" aria-label="Main">
<svg class="logo" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Night Ledger"><rect x="6" y="5" width="20" height="22" rx="4" fill="none" stroke="#3FA3EA" stroke-width="2.6"/><path d="M11 12h10M11 17h10M11 22h6" stroke="#3FA3EA" stroke-width="2.6" stroke-linecap="round"/><circle cx="25" cy="7" r="4" fill="#F6C35B"/></svg>
<button data-view="board" aria-label="Board" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="5" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="9.5" y="4" width="5" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="15.5" y="4" width="5" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg><span class="dot" id="navdot" hidden></span></button>
<button data-view="calls" aria-label="All calls"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h3l1.5 4-2 1.5a11 11 0 0 0 6 6l1.5-2 4 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 4.5 5.5a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
<button data-view="analytics" aria-label="Analytics"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
<button data-view="setup" aria-label="Setup"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 17h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="7" r="2.5" fill="#121826" stroke="currentColor" stroke-width="2"/><circle cx="15" cy="17" r="2.5" fill="#121826" stroke="currentColor" stroke-width="2"/></svg></button>
<button data-view="demo" aria-label="Demo controls"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
<div class="spacer"></div>
<span class="me" title="K. Mensah, house supervisor">KM</span>
</nav>
<main id="main" aria-live="polite"></main>
</div>
</div>
<div id="respond"></div>
<div id="drawer"></div>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
