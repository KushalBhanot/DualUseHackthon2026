[project]
name = "night-ledger-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dateparser>=1.4.3",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "retell-sdk>=6.2.8",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
