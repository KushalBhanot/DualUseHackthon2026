services:
  - type: web
    name: night-ledger
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DEMO_SEED
        value: serious_earthquake
      - key: VERIFY_RETELL_SIGNATURE
        value: "1"
